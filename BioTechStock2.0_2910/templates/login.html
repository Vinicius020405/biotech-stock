<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistema de Estoque</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-login.css') }}">
</head>

<body>

    <main class="login-container">
        <div class="login-card text-center">

            <i class="bi bi-shield-lock-fill icon-glow" aria-hidden="true"></i>

            <h1>Controle de Estoque</h1>
            <p>Faça login para continuar</p>

            <!-- Mensagens do sistema com aviso imediato para leitores de tela -->
            <div aria-live="assertive" aria-atomic="true">
                {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% if mensagens %}
                {% for categoria, mensagem in mensagens %}
                <div class="alert alert-{{ 'danger' if categoria == 'erro' else categoria }}" role="alert">
                    {{ mensagem }}
                </div>
                {% endfor %}
                {% endif %}
                {% endwith %}
            </div>

            <form method="POST" action="{{ url_for('login') }}">

                <div class="mb-3 text-start">
                    <label for="email" class="form-label">E-mail</label>

                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           placeholder="exemplo@email.com"
                           required
                           aria-required="true"
                           autocomplete="email">
                </div>

                <div class="mb-3 text-start">
                    <label for="senha" class="form-label">Senha</label>

                    <input type="password"
                           id="senha"
                           name="senha"
                           class="form-control"
                           placeholder="Digite sua senha"
                           required
                           aria-required="true"
                           autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-login w-100 mt-2">
                    <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>
                    Entrar
                </button>

            </form>

            <hr class="my-4">

            <a href="{{ url_for('index') }}" class="btn btn-outline-site w-100">
                <i class="bi bi-house-door-fill me-1" aria-hidden="true"></i>
                Voltar para o site
            </a>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
