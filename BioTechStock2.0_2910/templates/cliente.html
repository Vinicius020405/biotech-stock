<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área do Cliente - BIOTECH</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS DA ÁREA DO CLIENTE -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-cliente.css') }}">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar-custom">

        <div class="d-flex justify-content-between align-items-center">

            <div class="navbar-brand">

                <i class="bi bi-box-seam"></i>

                BIOTECH

            </div>

            <div class="usuario">

                Olá, <strong>{{ nome }}</strong>

                <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm btn-sair ms-3">

                    <i class="bi bi-box-arrow-right"></i>

                    Sair

                </a>

            </div>

        </div>

    </nav>


    <!-- HERO -->

    <section class="hero">

        <div class="container">

            <h1>

                Área do Cliente

            </h1>

            <p class="mb-0">

                Bem-vindo ao sistema BIOTECH.

                Aqui você poderá acompanhar seus pedidos e informações.

            </p>

        </div>

    </section>


    <!-- CONTEÚDO -->

    <div class="container py-5">

        <div class="row g-4">

            <div class="col-md-4">

                <div class="card-cliente">

                    <div class="icone">

                        <i class="bi bi-box-seam"></i>

                    </div>

                    <h4>

                        Produtos

                    </h4>

                    <p class="text-muted">

                        Consulte os produtos disponíveis no sistema.

                    </p>

                    <button class="btn btn-primary">

                        Ver produtos

                    </button>

                </div>

            </div>


            <div class="col-md-4">

                <div class="card-cliente">

                    <div class="icone">

                        <i class="bi bi-cart-check"></i>

                    </div>

                    <h4>

                        Meus pedidos

                    </h4>

                    <p class="text-muted">

                        Acompanhe seus pedidos realizados.

                    </p>

                    <button class="btn btn-primary">

                        Meus pedidos

                    </button>

                </div>

            </div>


            <div class="col-md-4">

                <div class="card-cliente">

                    <div class="icone">

                        <i class="bi bi-person-circle"></i>

                    </div>

                    <h4>

                        Minha conta

                    </h4>

                    <p class="text-muted">

                        Consulte suas informações de usuário.

                    </p>

                    <button class="btn btn-primary">

                        Minha conta

                    </button>

                </div>

            </div>

        </div>

    </div>


</body>

</html>
